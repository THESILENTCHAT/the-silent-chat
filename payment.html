<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата | THE SILENT CHAT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .payment-container {
            max-width: 500px;
            margin: 10vh auto;
            padding: 2rem;
            background: rgba(10, 10, 15, 0.95);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            text-align: center;
        }
        .status-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .success { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }
        .error { color: #ff5f56; text-shadow: 0 0 15px #ff5f56; }
        .loading { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="payment-container" id="main-box">
        <!-- ШАГ 1: Ожидание оплаты -->
        <div id="step-pay">
            <h2>Оплата заказа</h2>
            <p style="margin: 1.5rem 0; color: var(--text-dim);">ID получателя: <strong id="player-id-display" style="color: white;">...</strong></p>
            <p>Выберите банк для перевода:</p>
            <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn" onclick="processPayment()">СБЕРБАНК</button>
                <button class="btn" onclick="processPayment()">ТИНЬКОФФ</button>
                <button class="btn" onclick="processPayment()">ДРУГОЙ БАНК</button>
            </div>
        </div>

        <!-- ШАГ 2: Проверка оплаты (загрузка) -->
        <div id="step-loading" style="display: none;">
            <div class="status-icon loading">⏳</div>
            <h2>Проверка транзакции...</h2>
            <p style="margin-top: 1rem; color: var(--text-dim);">Пожалуйста, подождите, мы проверяем поступление средств.</p>
        </div>

        <!-- ШАГ 3: Успех -->
        <div id="step-success" style="display: none;">
            <div class="status-icon success">✅</div>
            <h2 class="success">ОПЛАТА ПРОШЛА</h2>
            <p style="margin-top: 1rem;">Баланс игры пополнен. Можете вернуться в приложение!</p>
            <button class="btn" style="margin-top: 2rem;" onclick="window.close()">ВЕРНУТЬСЯ В ИГРУ</button>
        </div>
    </div>

    <script>
        // Матричный дождь (тот же, что и на главной)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        let width, height, columns, drops;
        const fontSize = 16;
        const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*';
        
        function initMatrix() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.floor(width / fontSize);
            drops = new Array(columns).fill(1);
        }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.06)';
            ctx.fillRect(0, 0, width, height);
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const char = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillStyle = i % 8 === 0 ? '#ff00aa' : '#00f0ff';
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        initMatrix();
        window.addEventListener('resize', initMatrix);
        setInterval(drawMatrix, 50);

        // --- ЛОГИКА ОПЛАТЫ ---
        
        // Достаем ID из ссылки (например, payment.html?id=12345)
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id');
        
        if (playerId) {
            document.getElementById('player-id-display').textContent = playerId;
        } else {
            document.getElementById('player-id-display').textContent = "ОШИБКА (НЕТ ID)";
        }

        function processPayment() {
            // Скрываем кнопки, показываем загрузку
            document.getElementById('step-pay').style.display = 'none';
            document.getElementById('step-loading').style.display = 'block';

            // Имитация проверки оплаты (в реальности тут запрос к API банка)
            setTimeout(() => {
                document.getElementById('step-loading').style.display = 'none';
                
                // 80% шанс успеха для теста
                if (Math.random() > 0.2) {
                    document.getElementById('step-success').style.display = 'block';
                    // ТУТ В БУДУЩЕМ: Отправка запроса на сервер, чтобы начислить монеты игроку с ID playerId
                } else {
                    document.getElementById('step-pay').style.display = 'block';
                    alert("Ошибка оплаты. Попробуйте снова.");
                }
            }, 2500);
        }
    </script>
</body>
</html>
